<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="700" height="240" fill="#0f172a" rx="8" />
  
  <!-- Thread 1 -->
  <rect x="30" y="30" width="280" height="180" fill="#1e293b" stroke="#334155" stroke-width="2" rx="6" />
  <text x="40" y="55" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">Thread 1 (Producer)</text>
  
  <rect x="50" y="75" width="240" height="35" fill="#334155" rx="4" />
  <text x="60" y="97" fill="#e2e8f0" font-family="monospace" font-size="12">payload = 42 (Plain Write)</text>
  
  <line x1="170" y1="110" x2="170" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="50" y="135" width="240" height="35" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" rx="4" />
  <text x="60" y="157" fill="#ffffff" font-family="monospace" font-size="12">ready.store(true, release)</text>
  
  <!-- Edge Arrow Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="sync-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Synchronizes-with arrow -->
  <path d="M 290 152 C 340 152, 350 152, 390 152" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#sync-arrow)" />
  <text x="305" y="140" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">synchronizes-with</text>

  <!-- Thread 2 -->
  <rect x="390" y="30" width="280" height="180" fill="#1e293b" stroke="#334155" stroke-width="2" rx="6" />
  <text x="400" y="55" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">Thread 2 (Consumer)</text>
  
  <rect x="410" y="135" width="240" height="35" fill="#15803d" stroke="#4ade80" stroke-width="1.5" rx="4" />
  <text x="420" y="157" fill="#ffffff" font-family="monospace" font-size="12">ready.load(acquire) == true</text>
  
  <line x1="530" y1="135" x2="530" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="410" y="75" width="240" height="35" fill="#334155" rx="4" />
  <text x="420" y="97" fill="#e2e8f0" font-family="monospace" font-size="12">read payload (Guaranteed 42)</text>
</svg>
