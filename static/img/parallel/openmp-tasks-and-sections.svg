<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <rect width="720" height="220" fill="#0f172a" rx="8"/>
  
  <!-- Loop Left Side -->
  <g transform="translate(20, 20)">
    <rect width="320" height="180" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="30" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Loop Worksharing (omp for)</text>
    
    <rect x="20" y="55" width="280" height="28" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="160" y="74" fill="#93c5fd" font-family="monospace" font-size="12" text-anchor="middle">Chunk 0: Iterations 0..24</text>
    
    <rect x="20" y="95" width="280" height="28" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="160" y="114" fill="#93c5fd" font-family="monospace" font-size="12" text-anchor="middle">Chunk 1: Iterations 25..49</text>

    <rect x="20" y="135" width="280" height="28" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="160" y="154" fill="#93c5fd" font-family="monospace" font-size="12" text-anchor="middle">Chunk 2: Iterations 50..74</text>
  </g>

  <!-- Task Graph Right Side -->
  <g transform="translate(380, 20)">
    <rect width="320" height="180" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="30" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Task Graph (depend clause)</text>
    
    <!-- Node A -->
    <rect x="30" y="80" width="75" height="35" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="67" y="102" fill="#6ee7b7" font-family="monospace" font-size="12" text-anchor="middle">Task A</text>
    
    <!-- Edge A->B -->
    <path d="M 105 97 L 135 97" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Node B -->
    <rect x="140" y="80" width="75" height="35" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="177" y="102" fill="#fde047" font-family="monospace" font-size="12" text-anchor="middle">Task B</text>

    <!-- Edge B->C -->
    <path d="M 215 97 L 245 97" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node C -->
    <rect x="250" y="80" width="55" height="35" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="277" y="102" fill="#fca5a5" font-family="monospace" font-size="12" text-anchor="middle">Task C</text>

    <text x="160" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">out(A) -> inout(B) -> in(C)</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
