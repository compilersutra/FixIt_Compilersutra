<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    2-Way Set-Associative Cache Address Decoding
  </text>

  <!-- Memory Address Bar -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="500" height="30" fill="#ffffff" stroke="#475569" stroke-width="1.5" rx="4"/>
    
    <!-- Tag Field -->
    <rect x="0" y="0" width="260" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="2"/>
    <text x="130" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Tag Bits [31:12]</text>
    
    <!-- Index Field -->
    <rect x="260" y="0" width="140" height="30" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" rx="2"/>
    <text x="330" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Index Bits [11:6]</text>
    
    <!-- Offset Field -->
    <rect x="400" y="0" width="100" height="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="2"/>
    <text x="450" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Offset [5:0]</text>
  </g>

  <!-- Router Lines -->
  <!-- Index line going down to Set Decoder -->
  <path d="M 380,75 L 380,115" fill="none" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Tag line going down to Comparators -->
  <path d="M 180,75 L 180,210 L 230,210" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 180,210 L 180,270 L 230,270" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Cache Set Structure Box -->
  <g transform="translate(240, 120)">
    <!-- Cache Set Block -->
    <rect x="0" y="0" width="310" height="180" fill="#ffffff" stroke="#334155" stroke-width="1.5" rx="4" />
    <text x="155" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Target Cache Set (Selected by Index)</text>

    <!-- Way 0 -->
    <rect x="15" y="30" width="280" height="55" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="4" />
    <text x="25" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">Way 0</text>
    <rect x="70" y="38" width="80" height="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="2"/>
    <text x="110" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">Tag RAM</text>
    <rect x="160" y="38" width="125" height="35" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="2"/>
    <text x="222" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Data Line (64B)</text>

    <!-- Way 1 -->
    <rect x="15" y="95" width="280" height="55" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="4" />
    <text x="25" y="113" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">Way 1</text>
    <rect x="70" y="103" width="80" height="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" rx="2"/>
    <text x="110" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">Tag RAM</text>
    <rect x="160" y="103" width="125" height="35" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="2"/>
    <text x="222" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Data Line (64B)</text>
  </g>

  <!-- Tag Comparators -->
  <circle cx="330" cy="175" r="10" fill="#0284c7" />
  <text x="330" y="179" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">=</text>

  <circle cx="330" cy="240" r="10" fill="#0284c7" />
  <text x="330" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">=</text>

  <!-- Match Output OR gate indicator -->
  <path d="M 340,175 L 570,175 L 570,310" fill="none" stroke="#16a34a" stroke-width="2" />
  <path d="M 340,240 L 560,240 L 560,310" fill="none" stroke="#16a34a" stroke-width="2" />

  <!-- Output Box -->
  <rect x="220" y="305" width="160" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="4" />
  <text x="300" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Hit / Miss Logic</text>
</svg>
